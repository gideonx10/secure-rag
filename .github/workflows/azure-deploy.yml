name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip and deploy via Azure CLI (no PDFs)
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "venv/*" \
            --exclude "vectorstore/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "publish-profile.xml" \
            --exclude "data/*"

          echo "Zip size: $(du -sh deploy.zip)"

          az webapp deploy \
            --name secure-rag-app-adi \
            --resource-group secure-rag-rg \
            --src-path deploy.zip \
            --type zip \
            --timeout 600 \
            --clean true \
            --restart true

      - name: Verify deployment
        run: |
          sleep 30
          curl https://secure-rag-app-adi.azurewebsites.net/health