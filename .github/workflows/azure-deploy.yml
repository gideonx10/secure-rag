name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get publishing credentials
        id: creds
        run: |
          CREDS=$(az webapp deployment list-publishing-credentials \
            --name secure-rag-app-adi \
            --resource-group secure-rag-rg \
            --query "{user:publishingUserName,pass:publishingPassword}" \
            -o json)
          echo "user=$(echo $CREDS | jq -r .user)" >> $GITHUB_OUTPUT
          echo "pass=$(echo $CREDS | jq -r .pass)" >> $GITHUB_OUTPUT

      - name: Create zip
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "venv/*" \
            --exclude "vectorstore/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "publish-profile.xml" \
            --exclude "data/*"
          echo "Zip size: $(du -sh deploy.zip)"

      - name: Deploy via Kudu ZIP API
        run: |
          curl -X POST \
            -u "${{ steps.creds.outputs.user }}:${{ steps.creds.outputs.pass }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://secure-rag-app-adi.scm.azurewebsites.net/api/zipdeploy" \
            -v

      - name: Restart app
        run: |
          az webapp restart \
            --name secure-rag-app-adi \
            --resource-group secure-rag-rg
          sleep 30
          curl https://secure-rag-app-adi.azurewebsites.net/health