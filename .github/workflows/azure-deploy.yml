name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip and deploy via Azure CLI
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "venv/*" \
            --exclude "vectorstore/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".env" \
            --exclude "publish-profile.xml"

          echo "Zip size: $(du -sh deploy.zip)"

          az webapp deploy \
            --name secure-rag-app-adi \
            --resource-group secure-rag-rg \
            --src-path deploy.zip \
            --type zip \
            --timeout 600 \
            --clean true \
            --restart true

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://secure-rag-app-adi.azurewebsites.net/health || echo "Health check failed"