name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Stop any stuck deployment
        run: |
          az webapp stop --name secure-rag-app-adi --resource-group secure-rag-rg
          sleep 10
          az webapp start --name secure-rag-app-adi --resource-group secure-rag-rg
          sleep 5

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: secure-rag-app-adi
          package: .